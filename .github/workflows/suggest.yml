name: Suggest commanders
# GENERATED by src/make_workflows.py from src/options.py.
# Pick vibe / colors / themes, run it, and read the ranked commander list on the run page.
# Then type your favorite into the Commander box of "Build and check a deck".
on:
  workflow_dispatch:
    inputs:
      vibe:
        description: "Deck vibe: the deck's personality (every vibe is Bracket 3). Mean vibes pick mean commanders. Applies even if you type a commander."
        required: false
        type: choice
        default: "Competitive-Casual: Win and Have a Good Time"
        options:
          - "Relaxed Casual"
          - "Social Table: Fun for Everyone"
          - "Competitive-Casual: Win and Have a Good Time"
          - "Chaos & Memes: Chaotic Fun"
          - "Table Threat: Scary to Play Against"
          - "Hostile Control: Stax & Hate"
          - "Optimized Menace: Max-Power Bracket 3"
      colors:
        description: "Colors (exact color identity). Ignored if you type a commander."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Mono-White (W)"
          - "Mono-Blue (U)"
          - "Mono-Black (B)"
          - "Mono-Red (R)"
          - "Mono-Green (G)"
          - "Azorius (WU)"
          - "Dimir (UB)"
          - "Rakdos (BR)"
          - "Gruul (RG)"
          - "Selesnya (WG)"
          - "Orzhov (WB)"
          - "Izzet (UR)"
          - "Golgari (BG)"
          - "Boros (WR)"
          - "Simic (UG)"
          - "Bant (WUG)"
          - "Esper (WUB)"
          - "Grixis (UBR)"
          - "Jund (BRG)"
          - "Naya (WRG)"
          - "Abzan (WBG)"
          - "Jeskai (WUR)"
          - "Sultai (UBG)"
          - "Mardu (WBR)"
          - "Temur (URG)"
          - "Yore-Tiller (no green) (WUBR)"
          - "Glint-Eye (no white) (UBRG)"
          - "Dune-Brood (no blue) (WBRG)"
          - "Ink-Treader (no black) (WURG)"
          - "Witch-Maw (no red) (WUBG)"
          - "Five-Color (WUBRG)"
          - "Colorless (C)"
      mechanical_theme:
        description: "Mechanical theme: how the deck plays."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "+1/+1 Counters"
          - "Spellslinger"
          - "Tokens & Go-Wide"
          - "Sacrifice & Aristocrats"
          - "Graveyard & Reanimator"
          - "Artifacts"
          - "Enchantress"
          - "Lifegain"
          - "Landfall & Lands Matter"
          - "Blink & Value"
          - "Equipment & Auras (Voltron)"
          - "Treasure & Clues"
          - "Group Slug & Burn"
          - "Group Hug & Politics"
          - "Combat & Aggro"
          - "Draw, Wheels & Discard"
          - "Big Creatures & Stompy"
      narrative_theme:
        description: "Narrative theme: flavor and imagery (creature types, card names, rules and flavor text). A soft nudge."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Pirates & the High Seas"
          - "Undead & Gothic Horror"
          - "Dragons & Fire"
          - "Enchanted Forest & Nature"
          - "Arcane Academia (Wizards & Scholars)"
          - "Knights & Chivalry"
          - "Angels & Divine Order"
          - "Demons & Infernal Pacts"
          - "Fae Courts & Trickery"
          - "Heists & Intrigue (Rogues & Spies)"
          - "Primal Wilds (Dinosaurs & Beasts)"
          - "Machines & Artifice"
          - "Cosmic Horror & the Void"
          - "Insect Swarm & Hive"
          - "War Hosts (Goblins, Orcs & Warriors)"
      tribe:
        description: "Creature type to emphasize (optional). Blank = tribal ONLY if the commander's own text references its type."
        required: false
        default: ""
jobs:
  suggest:
    runs-on: ubuntu-latest
    env:
      VIBE: ${{ inputs.vibe }}
      COLORS: ${{ inputs.colors }}
      MECH: ${{ inputs.mechanical_theme }}
      NARR: ${{ inputs.narrative_theme }}
      TRIBE: ${{ inputs.tribe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: day
        run: echo "d=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # one Scryfall download per day, reused across runs
        with:
          path: data/cards.json
          key: cards-v3-${{ steps.day.outputs.d }}
      - name: Fetch Scryfall data (skipped if cached today)
        run: test -s data/cards.json || python src/fetch_cards.py
      - uses: actions/cache@v4            # Commander Spellbook combo database, once per day
        with:
          path: data/combos.json
          key: combos-v1-${{ steps.day.outputs.d }}
      - name: Fetch combo data from Commander Spellbook (skipped if cached today; never fails the run)
        run: test -s data/combos.json || python src/fetch_combos.py
      - name: Find commanders that fit
        run: >
          python src/build_deck.py --suggest-only --vibe "$VIBE" --colors "$COLORS" --mech "$MECH"
          --narr "$NARR" --tribe "$TRIBE"
      - name: Run summary
        if: always()
        run: python src/summarize.py --suggest >> "$GITHUB_STEP_SUMMARY"
