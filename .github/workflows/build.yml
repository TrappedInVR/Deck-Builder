name: Build and check a deck
# GENERATED by src/make_workflows.py from src/options.py. Edit options.py and regenerate; don't hand-edit the choices.
# Click "Run workflow", pick your options, then read the summary on the run page (or download the deck-report artifact).
on:
  workflow_dispatch:
    inputs:
      randomize:
        description: "Surprise me: randomizes vibe, colors, and both themes (about 1 in 10 is a tribal deck whose tribe is the commander's own type). Anything you TYPE below is respected; the dropdowns above are ignored."
        required: false
        type: boolean
        default: false
      vibe:
        description: "Deck vibe: sets the bracket, power, and how mean or chaotic the deck is. Applies even if you type a commander."
        required: false
        type: choice
        default: "Competitive-Casual: Win and Have a Good Time (Bracket 3)"
        options:
          - "Relaxed Casual (Bracket 2)"
          - "Social Table: Fun for Everyone (Bracket 2)"
          - "Competitive-Casual: Win and Have a Good Time (Bracket 3)"
          - "Chaos & Memes: Chaotic Fun (Bracket 3)"
          - "Table Threat: Scary to Play Against (Bracket 3)"
          - "Hostile Control: Stax & Hate (Bracket 4)"
          - "Optimized Menace: High Power (Bracket 4)"
      colors:
        description: "Colors (exact color identity). Ignored if you type a commander."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Mono-White (W)"
          - "Mono-Blue (U)"
          - "Mono-Black (B)"
          - "Mono-Red (R)"
          - "Mono-Green (G)"
          - "Azorius (WU)"
          - "Dimir (UB)"
          - "Rakdos (BR)"
          - "Gruul (RG)"
          - "Selesnya (WG)"
          - "Orzhov (WB)"
          - "Izzet (UR)"
          - "Golgari (BG)"
          - "Boros (WR)"
          - "Simic (UG)"
          - "Bant (WUG)"
          - "Esper (WUB)"
          - "Grixis (UBR)"
          - "Jund (BRG)"
          - "Naya (WRG)"
          - "Abzan (WBG)"
          - "Jeskai (WUR)"
          - "Sultai (UBG)"
          - "Mardu (WBR)"
          - "Temur (URG)"
          - "Yore-Tiller (no green) (WUBR)"
          - "Glint-Eye (no white) (UBRG)"
          - "Dune-Brood (no blue) (WBRG)"
          - "Ink-Treader (no black) (WURG)"
          - "Witch-Maw (no red) (WUBG)"
          - "Five-Color (WUBRG)"
          - "Colorless (C)"
      mechanical_theme:
        description: "Mechanical theme: how the deck plays."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "+1/+1 Counters"
          - "Spellslinger"
          - "Tokens & Go-Wide"
          - "Sacrifice & Aristocrats"
          - "Graveyard & Reanimator"
          - "Artifacts"
          - "Enchantress"
          - "Lifegain"
          - "Landfall & Lands Matter"
          - "Blink & Value"
          - "Equipment & Auras (Voltron)"
          - "Treasure & Clues"
          - "Group Slug & Burn"
          - "Group Hug & Politics"
          - "Combat & Aggro"
          - "Draw, Wheels & Discard"
          - "Big Creatures & Stompy"
      narrative_theme:
        description: "Narrative theme: flavor and imagery (creature types, card names, rules and flavor text). A soft nudge."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Pirates & the High Seas"
          - "Undead & Gothic Horror"
          - "Dragons & Fire"
          - "Enchanted Forest & Nature"
          - "Arcane Academia (Wizards & Scholars)"
          - "Knights & Chivalry"
          - "Angels & Divine Order"
          - "Demons & Infernal Pacts"
          - "Fae Courts & Trickery"
          - "Heists & Intrigue (Rogues & Spies)"
          - "Primal Wilds (Dinosaurs & Beasts)"
          - "Machines & Artifice"
          - "Cosmic Horror & the Void"
          - "Insect Swarm & Hive"
          - "War Hosts (Goblins, Orcs & Warriors)"
      tribe:
        description: "Creature type to emphasize (optional). Blank = tribal ONLY if the commander's own text references its type."
        required: false
        default: ""
      pick_mode:
        description: "When Commander is blank: take the best match, or a random one from the top 10."
        required: false
        type: choice
        default: "Best match"
        options:
          - "Best match"
          - "Random from top 10 matches"
      commander:
        description: "Commander (optional, exact card name). Overrides the commander and colors dropdowns. Blank = pick one that fits."
        required: false
        default: ""
      budget:
        description: "Approx USD budget for the deck (blank = the vibe's default). Prices are rough."
        required: false
        default: ""
      must_include:
        description: "Cards to force in, separated by semicolons. Example: Sol Ring; Rhystic Study"
        required: false
        default: ""
      exclude:
        description: "Cards to leave out, separated by semicolons."
        required: false
        default: ""
      avoid:
        description: "Things this deck must never include, comma separated. Options: counterspells, discard, extra turns, fast mana, infect, land destruction, stax, theft, tutors, wipes"
        required: false
        default: ""
      seed:
        description: "Random seed (blank = new each time). Reuse a seed from a past run to reproduce a random result."
        required: false
        default: ""
      big_spell:
        description: "Mana value of your biggest finisher (for the speed estimate)."
        required: false
        default: "8"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RANDOMIZE: ${{ inputs.randomize }}
      VIBE: ${{ inputs.vibe }}
      COLORS: ${{ inputs.colors }}
      MECH: ${{ inputs.mechanical_theme }}
      NARR: ${{ inputs.narrative_theme }}
      TRIBE: ${{ inputs.tribe }}
      PICK_MODE: ${{ inputs.pick_mode }}
      COMMANDER: ${{ inputs.commander }}
      BUDGET: ${{ inputs.budget }}
      MUST: ${{ inputs.must_include }}
      EXCLUDE: ${{ inputs.exclude }}
      AVOID: ${{ inputs.avoid }}
      SEED: ${{ inputs.seed }}
      BIG: ${{ inputs.big_spell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: day
        run: echo "d=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # one Scryfall download per day, reused across runs
        with:
          path: data/cards.json
          key: cards-v2-${{ steps.day.outputs.d }}
      - name: Fetch Scryfall data (skipped if cached today)
        run: test -s data/cards.json || python src/fetch_cards.py
      - name: Plan and build the deck
        run: >
          python src/build_deck.py --randomize "$RANDOMIZE" --vibe "$VIBE" --colors "$COLORS" --mech "$MECH"
          --narr "$NARR" --tribe "$TRIBE" --pick-mode "$PICK_MODE" --commander "$COMMANDER" --budget "$BUDGET"
          --must "$MUST" --exclude "$EXCLUDE" --avoid "$AVOID" --seed "$SEED"
      - name: Goldfish simulation
        # Uses the tribe the builder settled on (typed, auto-detected, or none), saved in out/tribe.txt.
        run: python src/goldfish.py out/deck.txt --tribe "$(cat out/tribe.txt)" --big-spell "$BIG"
      - name: Bracket report
        run: python src/bracket_report.py out/deck.txt --target "$(cat out/target.txt)"
      - name: Run summary
        if: always()
        run: python src/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deck-report, path: out/ }
