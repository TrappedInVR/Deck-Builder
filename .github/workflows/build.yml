name: Build and check a deck
# GENERATED by src/make_workflows.py from src/options.py. Edit options.py and regenerate; don't hand-edit the choices.
# Click "Run workflow", pick your options, then read the summary on the run page (or download the deck-report artifact).
on:
  workflow_dispatch:
    inputs:
      commander:
        description: "1. Commander (optional). Type a name, even partly or misspelled, and the closest real commander is used. Leave blank to have one picked for you."
        required: false
        default: ""
      vibe:
        description: "2. Vibe: how the deck feels to play against. Every vibe is Bracket 3."
        required: false
        type: choice
        default: "Competitive-Casual: Win and Have a Good Time"
        options:
          - "Relaxed Casual"
          - "Social Table: Fun for Everyone"
          - "Competitive-Casual: Win and Have a Good Time"
          - "Chaos & Memes: Chaotic Fun"
          - "Table Threat: Scary to Play Against"
          - "Hostile Control: Stax & Hate"
          - "Optimized Menace: Max-Power Bracket 3"
      colors:
        description: "3. Colors (only used when Commander is blank)."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Mono-White (W)"
          - "Mono-Blue (U)"
          - "Mono-Black (B)"
          - "Mono-Red (R)"
          - "Mono-Green (G)"
          - "Azorius (WU)"
          - "Dimir (UB)"
          - "Rakdos (BR)"
          - "Gruul (RG)"
          - "Selesnya (WG)"
          - "Orzhov (WB)"
          - "Izzet (UR)"
          - "Golgari (BG)"
          - "Boros (WR)"
          - "Simic (UG)"
          - "Bant (WUG)"
          - "Esper (WUB)"
          - "Grixis (UBR)"
          - "Jund (BRG)"
          - "Naya (WRG)"
          - "Abzan (WBG)"
          - "Jeskai (WUR)"
          - "Sultai (UBG)"
          - "Mardu (WBR)"
          - "Temur (URG)"
          - "Yore-Tiller (no green) (WUBR)"
          - "Glint-Eye (no white) (UBRG)"
          - "Dune-Brood (no blue) (WBRG)"
          - "Ink-Treader (no black) (WURG)"
          - "Witch-Maw (no red) (WUBG)"
          - "Five-Color (WUBRG)"
          - "Colorless (C)"
      mechanical_theme:
        description: "4. Mechanical theme (optional): how the deck plays."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "+1/+1 Counters"
          - "Tokens & Go-Wide"
          - "Sacrifice & Aristocrats"
          - "Graveyard & Reanimator"
          - "Spellslinger"
          - "Artifacts"
          - "Enchantress"
          - "Equipment & Auras (Voltron)"
          - "Lifegain"
          - "Landfall & Lands Matter"
          - "Blink & Enter-the-Battlefield"
          - "Treasure, Clues & Food"
          - "Combat & Aggro"
          - "Big Creatures & Stompy"
          - "Group Slug & Burn"
          - "Group Hug & Politics"
          - "Card Draw & Wheels"
          - "Discard & Madness"
          - "Cast from Exile & Impulse Draw"
          - "Steal Your Opponents' Stuff"
          - "Mill Your Opponents"
          - "Poison & Proliferate"
          - "Superfriends (Planeswalkers)"
          - "Vehicles"
          - "Clones & Copies"
          - "Big Spells & X Costs"
          - "Flash & Instant-Speed"
          - "Legends Matter"
          - "Tap & Untap Engines"
          - "Dice & Coin Flips"
      narrative_theme:
        description: "5. Narrative theme (optional): the flavor and story."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Pirates & the High Seas"
          - "Undead & Gothic Horror"
          - "Dragons & Fire"
          - "Enchanted Forest & Nature"
          - "Arcane Academia (Wizards & Scholars)"
          - "Knights & Chivalry"
          - "Angels & Divine Order"
          - "Demons & Infernal Pacts"
          - "Fae Courts & Trickery"
          - "Heists & Intrigue (Rogues & Spies)"
          - "Primal Wilds (Dinosaurs & Beasts)"
          - "Machines & Artifice"
          - "Cosmic Horror & the Void"
          - "Insect Swarm & Hive"
          - "War Hosts (Goblins, Orcs & Warriors)"
          - "Wild West Outlaws"
          - "Samurai & Ninjas"
          - "Frost & Winter"
          - "Myths & Gods"
          - "Sun, Moon & Stars"
      tribe:
        description: "6. Creature type(s) to build around (optional), e.g. Elf or Angel/Dragon. Blank = only if the commander supports a type."
        required: false
        default: ""
      avoid:
        description: "7. Never include (optional), comma separated: combos, counterspells, discard, extra turns, fast mana, infect, land destruction, stax, theft, tutors, wipes."
        required: false
        default: ""
      must_include:
        description: "8. Cards to always include (optional), separated by ; (e.g. Sol Ring; Rhystic Study)."
        required: false
        default: ""
      exclude:
        description: "9. Cards to leave out (optional), separated by ;"
        required: false
        default: ""
      budget:
        description: "10. Budget in $ for the nonland cards (optional, max 500). Lands never count."
        required: false
        default: ""
      randomize:
        description: "11. Surprise me! Random vibe, colors and themes. Anything you typed above still counts."
        required: false
        type: boolean
        default: false
      seed:
        description: "12. Seed (optional): copy the number from a past run's summary to rebuild the same random deck."
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RANDOMIZE: ${{ inputs.randomize }}
      VIBE: ${{ inputs.vibe }}
      COLORS: ${{ inputs.colors }}
      MECH: ${{ inputs.mechanical_theme }}
      NARR: ${{ inputs.narrative_theme }}
      TRIBE: ${{ inputs.tribe }}
      COMMANDER: ${{ inputs.commander }}
      BUDGET: ${{ inputs.budget }}
      MUST: ${{ inputs.must_include }}
      EXCLUDE: ${{ inputs.exclude }}
      AVOID: ${{ inputs.avoid }}
      SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: day
        run: echo "d=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # one Scryfall download per day, reused across runs
        with:
          path: data/cards.json
          key: cards-v3-${{ steps.day.outputs.d }}
      - name: Fetch Scryfall data (skipped if cached today)
        run: test -s data/cards.json || python src/fetch_cards.py
      - uses: actions/cache@v4            # Commander Spellbook combo database, once per day
        with:
          path: data/combos.json
          key: combos-v1-${{ steps.day.outputs.d }}
      - name: Fetch combo data from Commander Spellbook (skipped if cached today; never fails the run)
        run: test -s data/combos.json || python src/fetch_combos.py
      - id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # Scryfall Tagger function tags, once per week (a few hundred polite API calls)
        with:
          path: data/tags.json
          key: tags-v1-${{ steps.week.outputs.w }}
      - name: Fetch Scryfall Tagger function tags (skipped if cached this week; never fails the run)
        run: test -s data/tags.json || python src/fetch_tags.py || true
      - name: Plan and build the deck
        run: >
          python src/build_deck.py --randomize "$RANDOMIZE" --vibe "$VIBE" --colors "$COLORS" --mech "$MECH"
          --narr "$NARR" --tribe "$TRIBE" --commander "$COMMANDER" --budget "$BUDGET"
          --must "$MUST" --exclude "$EXCLUDE" --avoid "$AVOID" --seed "$SEED"
      - name: Goldfish simulation
        # Uses the tribe the builder settled on (typed, auto-detected, or none), saved in out/tribe.txt.
        run: python src/goldfish.py out/deck.txt --tribe "$(cat out/tribe.txt)"
      - name: Bracket report
        run: python src/bracket_report.py out/deck.txt --target "$(cat out/target.txt)"
      - name: Run summary
        if: always()
        run: python src/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deck-report, path: out/ }
