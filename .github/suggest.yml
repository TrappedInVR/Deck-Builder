name: Suggest commanders
# GENERATED by src/make_workflows.py from src/options.py.
# Pick vibe / colors / themes, run it, and read the ranked commander list on the run page.
# Then type your favorite into the Commander box of "Build and check a deck".
on:
  workflow_dispatch:
    inputs:
      vibe:
        description: "1. Vibe: how the deck feels to play against. Every vibe is Bracket 3."
        required: false
        type: choice
        default: "Competitive-Casual: Win and Have a Good Time"
        options:
          - "Relaxed Casual"
          - "Social Table: Fun for Everyone"
          - "Competitive-Casual: Win and Have a Good Time"
          - "Chaos & Memes: Chaotic Fun"
          - "Table Threat: Scary to Play Against"
          - "Hostile Control: Stax & Hate"
          - "Optimized Menace: Max-Power Bracket 3"
      colors:
        description: "2. Colors."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Mono-White (W)"
          - "Mono-Blue (U)"
          - "Mono-Black (B)"
          - "Mono-Red (R)"
          - "Mono-Green (G)"
          - "Azorius (WU)"
          - "Dimir (UB)"
          - "Rakdos (BR)"
          - "Gruul (RG)"
          - "Selesnya (WG)"
          - "Orzhov (WB)"
          - "Izzet (UR)"
          - "Golgari (BG)"
          - "Boros (WR)"
          - "Simic (UG)"
          - "Bant (WUG)"
          - "Esper (WUB)"
          - "Grixis (UBR)"
          - "Jund (BRG)"
          - "Naya (WRG)"
          - "Abzan (WBG)"
          - "Jeskai (WUR)"
          - "Sultai (UBG)"
          - "Mardu (WBR)"
          - "Temur (URG)"
          - "Yore-Tiller (no green) (WUBR)"
          - "Glint-Eye (no white) (UBRG)"
          - "Dune-Brood (no blue) (WBRG)"
          - "Ink-Treader (no black) (WURG)"
          - "Witch-Maw (no red) (WUBG)"
          - "Five-Color (WUBRG)"
          - "Colorless (C)"
      mechanical_theme:
        description: "3. Mechanical theme (optional): how the deck plays."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "+1/+1 Counters"
          - "Tokens & Go-Wide"
          - "Sacrifice & Aristocrats"
          - "Graveyard & Reanimator"
          - "Spellslinger"
          - "Artifacts"
          - "Enchantress"
          - "Equipment & Auras (Voltron)"
          - "Lifegain"
          - "Landfall & Lands Matter"
          - "Blink & Enter-the-Battlefield"
          - "Treasure, Clues & Food"
          - "Combat & Aggro"
          - "Big Creatures & Stompy"
          - "Group Slug & Burn"
          - "Group Hug & Politics"
          - "Card Draw & Wheels"
          - "Discard & Madness"
          - "Cast from Exile & Impulse Draw"
          - "Steal Your Opponents' Stuff"
          - "Mill Your Opponents"
          - "Poison & Proliferate"
          - "Superfriends (Planeswalkers)"
          - "Vehicles"
          - "Clones & Copies"
          - "Big Spells & X Costs"
          - "Flash & Instant-Speed"
          - "Legends Matter"
          - "Tap & Untap Engines"
          - "Dice & Coin Flips"
      narrative_theme:
        description: "4. Narrative theme (optional): the flavor and story."
        required: false
        type: choice
        default: "Any (no preference)"
        options:
          - "Any (no preference)"
          - "Pirates & the High Seas"
          - "Undead & Gothic Horror"
          - "Dragons & Fire"
          - "Enchanted Forest & Nature"
          - "Arcane Academia (Wizards & Scholars)"
          - "Knights & Chivalry"
          - "Angels & Divine Order"
          - "Demons & Infernal Pacts"
          - "Fae Courts & Trickery"
          - "Heists & Intrigue (Rogues & Spies)"
          - "Primal Wilds (Dinosaurs & Beasts)"
          - "Machines & Artifice"
          - "Cosmic Horror & the Void"
          - "Insect Swarm & Hive"
          - "War Hosts (Goblins, Orcs & Warriors)"
          - "Wild West Outlaws"
          - "Samurai & Ninjas"
          - "Frost & Winter"
          - "Myths & Gods"
          - "Sun, Moon & Stars"
      tribe:
        description: "5. Creature type(s) to build around (optional), e.g. Elf or Angel/Dragon. Blank = only if the commander supports a type."
        required: false
        default: ""
jobs:
  suggest:
    runs-on: ubuntu-latest
    env:
      VIBE: ${{ inputs.vibe }}
      COLORS: ${{ inputs.colors }}
      MECH: ${{ inputs.mechanical_theme }}
      NARR: ${{ inputs.narrative_theme }}
      TRIBE: ${{ inputs.tribe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: day
        run: echo "d=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # one Scryfall download per day, reused across runs
        with:
          path: data/cards.json
          key: cards-v3-${{ steps.day.outputs.d }}
      - name: Fetch Scryfall data (skipped if cached today)
        run: test -s data/cards.json || python src/fetch_cards.py
      - uses: actions/cache@v4            # Commander Spellbook combo database, once per day
        with:
          path: data/combos.json
          key: combos-v1-${{ steps.day.outputs.d }}
      - name: Fetch combo data from Commander Spellbook (skipped if cached today; never fails the run)
        run: test -s data/combos.json || python src/fetch_combos.py
      - id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # Scryfall Tagger function tags, once per week (a few hundred polite API calls)
        with:
          path: data/tags.json
          key: tags-v1-${{ steps.week.outputs.w }}
      - name: Fetch Scryfall Tagger function tags (skipped if cached this week; never fails the run)
        run: test -s data/tags.json || python src/fetch_tags.py || true
      - uses: actions/cache@v4            # MTGJSON precon lists (weekly) + EDHTop16 per-commander tournament data (7 days)
        with:
          path: |
            data/reference.json
            data/edhtop16
          key: reference-v1-${{ steps.week.outputs.w }}
      - name: Fetch precon decklists from MTGJSON (skipped if cached this week; never fails the run)
        run: test -s data/reference.json || python src/fetch_reference.py || true
      - uses: actions/cache@v4            # Forge card scripts (structured card logic), once per week
        with:
          path: |
            data/forge
            data/forge_db.json
          key: forge-v1-${{ steps.week.outputs.w }}
      - name: Fetch Forge card scripts (skipped if cached this week; never fails the run)
        run: |
          if [ ! -d data/forge/forge-gui/res/cardsfolder ]; then
            git clone --depth 1 --filter=blob:none --sparse https://github.com/Card-Forge/forge.git data/forge               && git -C data/forge sparse-checkout set forge-gui/res/cardsfolder               && echo "Forge scripts: $(find data/forge/forge-gui/res/cardsfolder -name '*.txt' | wc -l) cards"               || echo "Forge scripts unavailable this run; the builder reads rules text only"
          fi
      - name: Find commanders that fit
        run: >
          python src/build_deck.py --suggest-only --vibe "$VIBE" --colors "$COLORS" --mech "$MECH"
          --narr "$NARR" --tribe "$TRIBE"
      - name: Run summary
        if: always()
        run: python src/summarize.py --suggest >> "$GITHUB_STEP_SUMMARY"
